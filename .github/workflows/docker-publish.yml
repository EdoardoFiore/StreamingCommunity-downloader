name: Docker Publish

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  build-and-push:
    needs: test
    # A push to main is not a release: it runs the tests and publishes nothing,
    # so `latest` and the version the panel announces can only move together.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release builds (v* tags) and work-in-progress builds go to two different
      # GHCR packages. A branch build can then never be pulled by a deployment
      # pointing at the release image, and the whole -dev package can be cleared
      # out without touching release history.
      - name: Choose the package for this ref
        id: target
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          # Spelled out below instead of left to the action's automatic rule. A
          # pre-release tag is never `latest`, as the panel's check never offers it.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}
            type=sha,format=short

      # Both images are published for amd64 and arm64, so the template runs as
      # is on Apple Silicon, a Raspberry Pi or an ARM server: with amd64 only,
      # `docker compose up` there stops at "no matching manifest for
      # linux/arm64/v8". The runner is amd64, so arm64 is built under QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The optional service that updates the panel's container. Same refs and
      # tags as the panel, in a package of its own.
      - name: Extract metadata (updater)
        id: meta_updater
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}-updater
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push (updater)
        uses: docker/build-push-action@v5
        with:
          context: updater
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_updater.outputs.tags }}
          labels: ${{ steps.meta_updater.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: Summarise what was published
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Immagine pubblicata"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ steps.meta_updater.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
