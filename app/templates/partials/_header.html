    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row align-items-center">
          <div class="col">
            <h2 class="page-title" id="page-title">Cerca</h2>
          </div>
          <div class="col-auto">
            <div class="header-actions">

              <!-- Notification bell -->
              <!-- No data-requires-auth: without accounts the bell shows the
                   panel's own notifications rather than a user's. -->
              <div class="notif-wrap">
                <button class="header-icon-btn" id="notif-button" data-action="notif:toggle" title="Notifiche">
                  <i class="ti ti-bell"></i>
                  <span class="notif-badge" id="notif-badge" style="display:none"></span>
                </button>
                <div class="notif-panel" id="notif-panel" style="display:none">
                  <div class="notif-header">
                    <span>Notifiche</span>
                    <span class="notif-actions" id="notif-actions">
                      <button class="btn-link-sm" data-action="notif:readAll">Segna lette</button>
                      <button class="btn-link-sm btn-link-danger" data-action="notif:clearAll">Elimina tutte</button>
                    </span>
                  </div>
                  <div id="notif-list"></div>
                </div>
              </div>

              <!-- Current user -->
              <div class="user-chip" data-requires-auth="1">
                <div class="user-chip-avatar" id="user-initials">?</div>
                <div class="user-chip-text">
                  <div class="user-chip-name" id="user-name">—</div>
                  <div class="user-chip-role" id="user-role"></div>
                </div>
                <button class="header-icon-btn" data-action="session:logout" title="Esci">
                  <i class="ti ti-logout"></i>
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
