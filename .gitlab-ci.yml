# Port of .github/workflows/docker-publish.yml
# Builds the Docker image and pushes it to the GitLab Container Registry.

stages:
  - build

build-and-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - export TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker build -t "$TAG" .
    # Merge request pipelines: build only, no push (mirrors PR behaviour)
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "Merge request pipeline - build only, skipping push"
        exit 0
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$TAG"
    # 'latest' only on the default branch (mirrors enable={{is_default_branch}})
    - |
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    # Semver tag push on git tags (e.g. v1.2.3)
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$TAG" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    # Default branch or any vX.Y.Z tag -> build + push
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    # Merge requests -> build only, no push
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
