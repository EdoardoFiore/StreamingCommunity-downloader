# Port of .github/workflows/docker-publish.yml
# Builds the Docker image with kaniko (no Docker daemon / dind needed)
# and pushes it to the GitLab Container Registry.

stages:
  - test
  - build

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install --no-cache-dir -r requirements-dev.txt
    - pytest -q
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build-and-push:
  stage: build
  needs: [test]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    # Registry auth: kaniko reads /kaniko/.docker/config.json
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
    # Build tag list: always branch/tag slug; +latest on default branch; +semver on git tags
    - |
      DESTS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        DESTS="$DESTS --destination $CI_REGISTRY_IMAGE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTS="$DESTS --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
      # Merge requests: build only, no push (mirrors PR behaviour)
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        DESTS="--no-push"
      fi
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        $DESTS
  rules:
    # Default branch or any vX.Y.Z tag -> build + push
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    # Merge requests -> build only, no push
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
